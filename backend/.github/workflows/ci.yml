name: BankOS CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bankos
          POSTGRES_PASSWORD: local_postgres_only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: cp .env.example .env
      - run: npm test
      - run: npm run migrate
      - run: npm run test:e2e
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail http://127.0.0.1:3000/api/v1/health
      - if: always()
        run: docker compose down --volumes
